<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow Field Particle System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
        }

        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(20, 20, 30, 0.9);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            color: white;
            max-width: 300px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            z-index: 1000;
        }

        .mode-btn {
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .mode-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }

        .mode-btn.active {
            border-color: rgb(139, 92, 246);
            background: rgba(139, 92, 246, 0.2);
        }

        input[type="range"] {
            width: 100%;
            accent-color: rgb(139, 92, 246);
        }

        .slider-container {
            margin: 12px 0;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.9);
        }

        @media (max-width: 768px) {
            .controls {
                top: 10px;
                right: 10px;
                left: 10px;
                max-width: none;
                padding: 15px;
            }
        }
    </style>
</head>
<body class="bg-gray-900">

<div class="controls">
    <h2 class="text-xl font-bold mb-4 text-purple-400">Flow Field</h2>

    <!-- Mode Buttons -->
    <div class="mb-4">
        <div class="text-sm text-gray-400 mb-2">Mode</div>
        <div class="grid grid-cols-2 gap-2">
            <button class="mode-btn px-3 py-2 bg-gray-800 rounded text-sm" data-mode="spiral">Spiral</button>
            <button class="mode-btn px-3 py-2 bg-gray-800 rounded text-sm" data-mode="wave">Wave</button>
            <button class="mode-btn px-3 py-2 bg-gray-800 rounded text-sm" data-mode="chaos">Chaos</button>
            <button class="mode-btn px-3 py-2 bg-gray-800 rounded text-sm" data-mode="symmetry">Symmetry</button>
            <button class="mode-btn px-3 py-2 bg-gray-800 rounded text-sm" data-mode="attractor">Attractor</button>
            <button class="mode-btn px-3 py-2 bg-gray-800 rounded text-sm" data-mode="perlin">Perlin</button>
        </div>
    </div>

    <!-- Sliders -->
    <div class="slider-container">
        <div class="slider-label">
            <span>Particles</span>
            <span id="particleCount">5000</span>
        </div>
        <input type="range" id="particleSlider" min="1000" max="10000" value="5000" step="500">
    </div>

    <div class="slider-container">
        <div class="slider-label">
            <span>Speed</span>
            <span id="speedValue">2.0</span>
        </div>
        <input type="range" id="speedSlider" min="0.5" max="5" value="2" step="0.1">
    </div>

    <div class="slider-container">
        <div class="slider-label">
            <span>Trail Length</span>
            <span id="trailValue">10</span>
        </div>
        <input type="range" id="trailSlider" min="1" max="50" value="10" step="1">
    </div>

    <div class="slider-container">
        <div class="slider-label">
            <span>Color Shift</span>
            <span id="colorValue">1.0</span>
        </div>
        <input type="range" id="colorSlider" min="0.1" max="3" value="1" step="0.1">
    </div>

    <!-- Action Buttons -->
    <div class="mt-4 space-y-2">
        <button id="resetBtn" class="w-full px-4 py-2 bg-purple-600 hover:bg-purple-700 rounded text-sm font-medium transition">
            Reset
        </button>
        <button id="exportBtn" class="w-full px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded text-sm font-medium transition">
            Export PNG
        </button>
    </div>

    <div class="mt-4 text-xs text-gray-500 text-center">
        Click to add attractors/repellers<br>
        Move mouse to disturb field
    </div>
</div>

<script>
// ============================================
// GLOBAL CONFIGURATION
// ============================================
let particles = [];
let flowField;
let currentMode = 'spiral';
let settings = {
    particleCount: 5000,
    speed: 2.0,
    trailLength: 10,
    colorShiftSpeed: 1.0
};

// Time and animation
let timeOffset = 0;
let colorOffset = 0;
let modeTransition = 0; // For smooth mode transitions

// Interactive points (attractors/repellers)
let interactionPoints = [];

// ============================================
// PARTICLE CLASS
// Represents individual particles with trails
// ============================================
class Particle {
    constructor() {
        this.pos = createVector(random(width), random(height));
        this.vel = createVector(0, 0);
        this.acc = createVector(0, 0);
        this.maxSpeed = 4;
        this.prevPos = this.pos.copy();

        // Color properties for gradient effects
        this.hue = random(360);
        this.opacity = random(150, 255);
    }

    // Apply force from flow field
    applyForce(force) {
        this.acc.add(force);
    }

    // Update particle physics
    update() {
        this.vel.add(this.acc);
        this.vel.limit(this.maxSpeed * settings.speed);

        // Store previous position for trail
        this.prevPos = this.pos.copy();
        this.pos.add(this.vel);

        // Reset acceleration each frame
        this.acc.mult(0);

        // Wrap around edges
        this.edges();
    }

    // Follow the flow field
    follow(flowField) {
        let x = floor(this.pos.x / flowField.resolution);
        let y = floor(this.pos.y / flowField.resolution);
        let index = x + y * flowField.cols;

        if (flowField.vectors[index]) {
            let force = flowField.vectors[index].copy();
            force.mult(0.1);
            this.applyForce(force);
        }
    }

    // Handle edge wrapping
    edges() {
        if (this.pos.x > width) {
            this.pos.x = 0;
            this.prevPos.x = 0;
        }
        if (this.pos.x < 0) {
            this.pos.x = width;
            this.prevPos.x = width;
        }
        if (this.pos.y > height) {
            this.pos.y = 0;
            this.prevPos.y = 0;
        }
        if (this.pos.y < 0) {
            this.pos.y = height;
            this.prevPos.y = height;
        }
    }

    // Render particle with trail
    show() {
        // Calculate color with time-based shift
        let hue = (this.hue + colorOffset) % 360;
        let saturation = map(sin(frameCount * 0.01 + this.hue), -1, 1, 60, 100);
        let brightness = map(this.vel.mag(), 0, this.maxSpeed, 50, 100);

        stroke(hue, saturation, brightness, this.opacity);
        strokeWeight(1.5);
        line(this.prevPos.x, this.prevPos.y, this.pos.x, this.pos.y);
    }
}

// ============================================
// FLOW FIELD CLASS
// Generates vector field using various algorithms
// ============================================
class FlowField {
    constructor(resolution) {
        this.resolution = resolution;
        this.cols = floor(width / resolution);
        this.rows = floor(height / resolution);
        this.vectors = new Array(this.cols * this.rows);
        this.update();
    }

    // Update flow field based on current mode
    update() {
        let xOff = 0;

        for (let y = 0; y < this.rows; y++) {
            let yOff = 0;

            for (let x = 0; x < this.cols; x++) {
                let index = x + y * this.cols;

                // Calculate angle based on mode
                let angle = this.calculateAngle(x, y, xOff, yOff);

                // Create vector from angle
                let v = p5.Vector.fromAngle(angle);
                v.setMag(1);
                this.vectors[index] = v;

                yOff += 0.1;
            }
            xOff += 0.1;
        }
    }

    // Calculate angle based on current mode and position
    calculateAngle(x, y, xOff, yOff) {
        let centerX = this.cols / 2;
        let centerY = this.rows / 2;
        let angle = 0;

        switch(currentMode) {
            case 'perlin':
                // Classic Perlin noise flow field
                angle = noise(xOff, yOff, timeOffset) * TWO_PI * 4;
                break;

            case 'spiral':
                // Circular spiral pattern
                let dx = x - centerX;
                let dy = y - centerY;
                let distFromCenter = sqrt(dx * dx + dy * dy);
                angle = atan2(dy, dx) + distFromCenter * 0.1 + timeOffset;
                angle += noise(x * 0.05, y * 0.05, timeOffset) * 2;
                break;

            case 'wave':
                // Undulating wave motion
                angle = sin(x * 0.05 + timeOffset) * PI +
                        cos(y * 0.05 + timeOffset) * PI;
                angle += noise(xOff, yOff) * PI;
                break;

            case 'chaos':
                // Turbulent randomness with multiple noise octaves
                let n1 = noise(xOff, yOff, timeOffset);
                let n2 = noise(xOff * 2, yOff * 2, timeOffset * 2);
                let n3 = noise(xOff * 4, yOff * 4, timeOffset * 4);
                angle = (n1 * 2 + n2 + n3 * 0.5) * TWO_PI * 2;
                break;

            case 'symmetry':
                // Mirror/symmetry effects
                let sx = abs(x - centerX);
                let sy = abs(y - centerY);
                angle = noise(sx * 0.1, sy * 0.1, timeOffset) * TWO_PI * 4;
                angle += atan2(dy, dx);
                break;

            case 'attractor':
                // Central gravity well with rotation
                dx = x - centerX;
                dy = y - centerY;
                let dist = sqrt(dx * dx + dy * dy) + 1;
                angle = atan2(dy, dx) + PI/2; // Perpendicular for rotation
                angle += (1 / dist) * 10; // Stronger near center
                angle += noise(xOff * 0.5, yOff * 0.5, timeOffset) * PI;
                break;
        }

        // Apply interaction points (mouse clicks)
        for (let point of interactionPoints) {
            let px = floor(point.x / this.resolution);
            let py = floor(point.y / this.resolution);
            let pdx = x - px;
            let pdy = y - py;
            let pdist = sqrt(pdx * pdx + pdy * pdy) + 1;

            if (pdist < 20) {
                let force = point.repel ? 1 : -1;
                angle += (force / pdist) * point.strength;
            }
        }

        return angle;
    }
}

// ============================================
// P5.JS SETUP
// ============================================
function setup() {
    createCanvas(windowWidth, windowHeight);
    colorMode(HSB, 360, 100, 100, 255);

    // Initialize flow field
    flowField = new FlowField(20);

    // Create initial particles
    for (let i = 0; i < settings.particleCount; i++) {
        particles.push(new Particle());
    }

    // Setup UI event listeners
    setupUI();

    // Set initial mode
    setMode('spiral');
}

// ============================================
// P5.JS DRAW LOOP
// ============================================
function draw() {
    // Background with fade for trail effect
    // Lower alpha = longer trails
    let trailAlpha = map(settings.trailLength, 1, 50, 50, 2);
    background(20, 20, 30, trailAlpha);

    // Update time offsets for animation
    timeOffset += 0.003;
    colorOffset += settings.colorShiftSpeed * 0.5;

    // Update flow field periodically
    if (frameCount % 3 === 0) {
        flowField.update();
    }

    // Update and draw all particles
    for (let particle of particles) {
        particle.follow(flowField);

        // Apply mouse disturbance
        applyMouseDisturbance(particle);

        particle.update();
        particle.show();
    }

    // Draw interaction points
    drawInteractionPoints();

    // Decay interaction points over time
    for (let i = interactionPoints.length - 1; i >= 0; i--) {
        interactionPoints[i].life--;
        interactionPoints[i].strength *= 0.98;

        if (interactionPoints[i].life <= 0) {
            interactionPoints.splice(i, 1);
        }
    }
}

// ============================================
// MOUSE & TOUCH INTERACTION
// ============================================

// Apply subtle force based on mouse movement
function applyMouseDisturbance(particle) {
    if (mouseX > 0 && mouseX < width && mouseY > 0 && mouseY < height) {
        let mouse = createVector(mouseX, mouseY);
        let dist = p5.Vector.dist(particle.pos, mouse);

        if (dist < 100) {
            let force = p5.Vector.sub(particle.pos, mouse);
            force.normalize();
            force.mult(map(dist, 0, 100, 0.5, 0));
            particle.applyForce(force);
        }
    }
}

// Add attractor/repeller on click
function mousePressed() {
    if (mouseX < width - 320) { // Don't add if clicking on controls
        let repel = mouseButton === RIGHT || keyIsPressed && keyCode === SHIFT;
        interactionPoints.push({
            x: mouseX,
            y: mouseY,
            strength: 5,
            life: 300,
            repel: repel
        });
        return false; // Prevent default
    }
}

// Touch support
function touchStarted() {
    if (touches.length > 0) {
        let touch = touches[0];
        if (touch.x < width - 320) {
            interactionPoints.push({
                x: touch.x,
                y: touch.y,
                strength: 5,
                life: 300,
                repel: false
            });
        }
    }
    return false;
}

// Draw interaction point indicators
function drawInteractionPoints() {
    for (let point of interactionPoints) {
        let alpha = map(point.life, 0, 300, 0, 100);
        let size = map(point.strength, 0, 5, 10, 50);

        noFill();
        stroke(point.repel ? 0 : 200, 80, 100, alpha);
        strokeWeight(2);
        circle(point.x, point.y, size);

        strokeWeight(1);
        circle(point.x, point.y, size * 0.5);
    }
}

// ============================================
// UI CONTROLS & EVENTS
// ============================================
function setupUI() {
    // Mode buttons
    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            setMode(btn.dataset.mode);
        });
    });

    // Particle count slider
    const particleSlider = document.getElementById('particleSlider');
    const particleCount = document.getElementById('particleCount');
    particleSlider.addEventListener('input', (e) => {
        let newCount = parseInt(e.target.value);
        particleCount.textContent = newCount;

        // Add or remove particles
        if (newCount > particles.length) {
            for (let i = particles.length; i < newCount; i++) {
                particles.push(new Particle());
            }
        } else {
            particles.splice(newCount);
        }

        settings.particleCount = newCount;
    });

    // Speed slider
    const speedSlider = document.getElementById('speedSlider');
    const speedValue = document.getElementById('speedValue');
    speedSlider.addEventListener('input', (e) => {
        settings.speed = parseFloat(e.target.value);
        speedValue.textContent = settings.speed.toFixed(1);
    });

    // Trail slider
    const trailSlider = document.getElementById('trailSlider');
    const trailValue = document.getElementById('trailValue');
    trailSlider.addEventListener('input', (e) => {
        settings.trailLength = parseInt(e.target.value);
        trailValue.textContent = settings.trailLength;
    });

    // Color shift slider
    const colorSlider = document.getElementById('colorSlider');
    const colorValue = document.getElementById('colorValue');
    colorSlider.addEventListener('input', (e) => {
        settings.colorShiftSpeed = parseFloat(e.target.value);
        colorValue.textContent = settings.colorShiftSpeed.toFixed(1);
    });

    // Reset button
    document.getElementById('resetBtn').addEventListener('click', () => {
        resetSystem();
    });

    // Export button
    document.getElementById('exportBtn').addEventListener('click', () => {
        exportImage();
    });
}

// Set current mode and update UI
function setMode(mode) {
    currentMode = mode;

    // Update button styles
    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.remove('active');
    });
    document.querySelector(`[data-mode="${mode}"]`).classList.add('active');

    // Reset flow field for immediate update
    flowField.update();
}

// Reset the entire system
function resetSystem() {
    particles = [];
    interactionPoints = [];
    timeOffset = 0;
    colorOffset = 0;

    for (let i = 0; i < settings.particleCount; i++) {
        particles.push(new Particle());
    }

    background(20, 20, 30);
}

// Export current frame as high-res PNG
function exportImage() {
    // Create a high-res render
    let timestamp = new Date().toISOString().replace(/[:.]/g, '-');
    saveCanvas(`flow-field-${timestamp}`, 'png');
}

// Handle window resize
function windowResized() {
    resizeCanvas(windowWidth, windowHeight);
    flowField = new FlowField(20);

    // Reposition particles that are now out of bounds
    particles.forEach(p => {
        if (p.pos.x > width) p.pos.x = width;
        if (p.pos.y > height) p.pos.y = height;
    });
}

// Prevent right-click context menu (for repeller mode)
document.addEventListener('contextmenu', event => event.preventDefault());
</script>

</body>
</html>
