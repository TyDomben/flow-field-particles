<script>
// ============================================
// ERROR HANDLING
// ============================================
function handleCDNError(library) {
    document.getElementById('loadingScreen').innerHTML = `
        <div style="text-align: center; padding: 20px;">
            <h2 style="color: #ef4444; margin-bottom: 10px;">⚠️ Loading Error</h2>
            <p style="color: #9ca3af;">Failed to load ${library}.</p>
            <p style="color: #9ca3af; margin-top: 10px;">Please check your internet connection and refresh the page.</p>
        </div>
    `;
}

// ============================================
// GLOBAL CONFIGURATION
// ============================================
let particles = [];
let flowField;
let currentMode = 'spiral';
let previousMode = 'spiral';
let modeTransition = 1.0; // 0 = previous mode, 1 = current mode
let isPaused = false;
let showFPS = false;
let lastFrameTime = 0;
let fps = 60;

let settings = {
    particleCount: 5000,
    speed: 2.0,
    trailLength: 10,
    colorShiftSpeed: 1.0
};

// Time and animation
let timeOffset = 0;
let colorOffset = 0;

// Interactive points (attractors/repellers)
let interactionPoints = [];

// ============================================
// PARTICLE CLASS
// Represents individual particles with trails
// ============================================
class Particle {
    constructor() {
        this.pos = createVector(random(width), random(height));
        this.vel = createVector(0, 0);
        this.acc = createVector(0, 0);
        this.maxSpeed = 4;
        this.prevPos = this.pos.copy();

        // Color properties for gradient effects
        this.hue = random(360);
        this.opacity = random(150, 255);
    }

    // Apply force from flow field
    applyForce(force) {
        this.acc.add(force);
    }

    // Update particle physics
    update() {
        this.vel.add(this.acc);
        this.vel.limit(this.maxSpeed * settings.speed);

        // Store previous position for trail
        this.prevPos = this.pos.copy();
        this.pos.add(this.vel);

        // Reset acceleration each frame
        this.acc.mult(0);

        // Wrap around edges
        this.edges();
    }

    // Follow the flow field
    follow(flowField) {
        let x = floor(this.pos.x / flowField.resolution);
        let y = floor(this.pos.y / flowField.resolution);
        let index = x + y * flowField.cols;

        if (flowField.vectors[index]) {
            let force = flowField.vectors[index].copy();
            force.mult(0.1);
            this.applyForce(force);
        }
    }

    // Handle edge wrapping
    edges() {
        if (this.pos.x > width) {
            this.pos.x = 0;
            this.prevPos.x = 0;
        }
        if (this.pos.x < 0) {
            this.pos.x = width;
            this.prevPos.x = width;
        }
        if (this.pos.y > height) {
            this.pos.y = 0;
            this.prevPos.y = 0;
        }
        if (this.pos.y < 0) {
            this.pos.y = height;
            this.prevPos.y = height;
        }
    }

    // Render particle with trail
    show() {
        // Calculate color with time-based shift
        let hue = (this.hue + colorOffset) % 360;
        let saturation = map(sin(frameCount * 0.01 + this.hue), -1, 1, 60, 100);
        let brightness = map(this.vel.mag(), 0, this.maxSpeed, 50, 100);

        stroke(hue, saturation, brightness, this.opacity);
        strokeWeight(1.5);
        line(this.prevPos.x, this.prevPos.y, this.pos.x, this.pos.y);
    }
}

// ============================================
// FLOW FIELD CLASS
// Generates vector field using various algorithms
// ============================================
class FlowField {
    constructor(resolution) {
        this.resolution = resolution;
        this.cols = floor(width / resolution);
        this.rows = floor(height / resolution);
        this.vectors = new Array(this.cols * this.rows);
        this.update();
    }

    // Update flow field based on current mode
    update() {
        let xOff = 0;

        for (let y = 0; y < this.rows; y++) {
            let yOff = 0;

            for (let x = 0; x < this.cols; x++) {
                let index = x + y * this.cols;

                // Calculate angle based on mode
                let angle = this.calculateAngle(x, y, xOff, yOff);

                // Create vector from angle
                let v = p5.Vector.fromAngle(angle);
                v.setMag(1);
                this.vectors[index] = v;

                yOff += 0.1;
            }
            xOff += 0.1;
        }
    }

    // Calculate angle based on current mode and position
    calculateAngle(x, y, xOff, yOff) {
        let centerX = this.cols / 2;
        let centerY = this.rows / 2;

        // If transitioning between modes, blend the angles
        if (modeTransition < 1.0) {
            let prevAngle = this.calculateModeAngle(previousMode, x, y, xOff, yOff, centerX, centerY);
            let currAngle = this.calculateModeAngle(currentMode, x, y, xOff, yOff, centerX, centerY);

            // Smooth interpolation between angles
            let angle = this.lerpAngle(prevAngle, currAngle, modeTransition);

            // Still apply interaction points
            angle = this.applyInteractionPoints(angle, x, y);
            return angle;
        }

        // Normal mode (no transition)
        let angle = this.calculateModeAngle(currentMode, x, y, xOff, yOff, centerX, centerY);
        angle = this.applyInteractionPoints(angle, x, y);
        return angle;
    }

    // Helper: Interpolate between two angles smoothly
    lerpAngle(a, b, t) {
        // Handle angle wrapping for smooth interpolation
        let diff = b - a;
        if (diff > PI) diff -= TWO_PI;
        if (diff < -PI) diff += TWO_PI;
        return a + diff * t;
    }

    // Helper: Calculate angle for a specific mode
    calculateModeAngle(mode, x, y, xOff, yOff, centerX, centerY) {
        let angle = 0;
        let dx, dy;

        switch(mode) {
            case 'perlin':
                // Classic Perlin noise flow field
                angle = noise(xOff, yOff, timeOffset) * TWO_PI * 4;
                break;

            case 'spiral':
                // Circular spiral pattern
                let dx = x - centerX;
                let dy = y - centerY;
                let distFromCenter = sqrt(dx * dx + dy * dy);
                angle = atan2(dy, dx) + distFromCenter * 0.1 + timeOffset;
                angle += noise(x * 0.05, y * 0.05, timeOffset) * 2;
                break;

            case 'wave':
                // Undulating wave motion
                angle = sin(x * 0.05 + timeOffset) * PI +
                        cos(y * 0.05 + timeOffset) * PI;
                angle += noise(xOff, yOff) * PI;
                break;

            case 'chaos':
                // Turbulent randomness with multiple noise octaves
                let n1 = noise(xOff, yOff, timeOffset);
                let n2 = noise(xOff * 2, yOff * 2, timeOffset * 2);
                let n3 = noise(xOff * 4, yOff * 4, timeOffset * 4);
                angle = (n1 * 2 + n2 + n3 * 0.5) * TWO_PI * 2;
                break;

            case 'symmetry':
                // Mirror/symmetry effects
                dx = x - centerX;
                dy = y - centerY;
                let sx = abs(dx);
                let sy = abs(dy);
                angle = noise(sx * 0.1, sy * 0.1, timeOffset) * TWO_PI * 4;
                angle += atan2(dy, dx);
                break;

            case 'attractor':
                // Central gravity well with rotation
                dx = x - centerX;
                dy = y - centerY;
                let dist = sqrt(dx * dx + dy * dy) + 1;
                angle = atan2(dy, dx) + PI/2; // Perpendicular for rotation
                angle += (1 / dist) * 10; // Stronger near center
                angle += noise(xOff * 0.5, yOff * 0.5, timeOffset) * PI;
                break;
        }

        return angle;
    }

    // Helper: Apply interaction point forces to angle
    applyInteractionPoints(angle, x, y) {
        for (let point of interactionPoints) {
            let px = floor(point.x / this.resolution);
            let py = floor(point.y / this.resolution);
            let pdx = x - px;
            let pdy = y - py;
            let pdist = sqrt(pdx * pdx + pdy * pdy) + 1;

            if (pdist < 20) {
                let force = point.repel ? 1 : -1;
                angle += (force / pdist) * point.strength;
            }
        }
        return angle;
    }
}

// ============================================
// P5.JS SETUP
// ============================================
function setup() {
    createCanvas(windowWidth, windowHeight);
    colorMode(HSB, 360, 100, 100, 255);

    // Initialize flow field
    flowField = new FlowField(20);

    // Create initial particles
    for (let i = 0; i < settings.particleCount; i++) {
        particles.push(new Particle());
    }

    // Setup UI event listeners
    setupUI();

    // Set initial mode
    setMode('spiral');

    // Hide loading screen
    setTimeout(() => {
        document.getElementById('loadingScreen').classList.add('hidden');
    }, 500);
}

// ============================================
// P5.JS DRAW LOOP
// ============================================
function draw() {
    // Calculate FPS
    if (showFPS) {
        let currentTime = millis();
        if (lastFrameTime > 0) {
            let timeDiff = currentTime - lastFrameTime;
            fps = Math.round(1000 / timeDiff);
            document.getElementById('fpsCounter').textContent = `FPS: ${fps}`;
        }
        lastFrameTime = currentTime;
    }

    // Background with fade for trail effect
    // Lower alpha = longer trails
    let trailAlpha = map(settings.trailLength, 1, 50, 50, 2);
    background(20, 20, 30, trailAlpha);

    // Skip updates if paused
    if (!isPaused) {
        // Update time offsets for animation
        timeOffset += 0.003;
        colorOffset += settings.colorShiftSpeed * 0.5;

        // Update mode transition (smooth blend between modes)
        if (modeTransition < 1.0) {
            modeTransition += 0.02; // Transition over ~50 frames (0.8 seconds)
            if (modeTransition > 1.0) modeTransition = 1.0;
        }

        // Update flow field periodically
        if (frameCount % 3 === 0) {
            flowField.update();
        }

        // Update and draw all particles
        for (let particle of particles) {
            particle.follow(flowField);

            // Apply mouse disturbance
            applyMouseDisturbance(particle);

            particle.update();
            particle.show();
        }

        // Decay interaction points over time
        for (let i = interactionPoints.length - 1; i >= 0; i--) {
            interactionPoints[i].life--;
            interactionPoints[i].strength *= 0.98;

            if (interactionPoints[i].life <= 0) {
                interactionPoints.splice(i, 1);
            }
        }
    } else {
        // Still draw particles when paused
        for (let particle of particles) {
            particle.show();
        }
    }

    // Always draw interaction points
    drawInteractionPoints();
}

// ============================================
// MOUSE & TOUCH INTERACTION
// ============================================

// Apply subtle force based on mouse movement
function applyMouseDisturbance(particle) {
    if (mouseX > 0 && mouseX < width && mouseY > 0 && mouseY < height) {
        let mouse = createVector(mouseX, mouseY);
        let dist = p5.Vector.dist(particle.pos, mouse);

        if (dist < 100) {
            let force = p5.Vector.sub(particle.pos, mouse);
            force.normalize();
            force.mult(map(dist, 0, 100, 0.5, 0));
            particle.applyForce(force);
        }
    }
}

// Add attractor/repeller on click
function mousePressed() {
    // Check if clicking on controls panel
    const controlsPanel = document.querySelector('.controls');
    const rect = controlsPanel.getBoundingClientRect();
    const clickedOnControls = mouseX >= rect.left && mouseX <= rect.right &&
                               mouseY >= rect.top && mouseY <= rect.bottom;

    if (!clickedOnControls) {
        let repel = mouseButton === RIGHT || (keyIsPressed && keyCode === SHIFT);
        interactionPoints.push({
            x: mouseX,
            y: mouseY,
            strength: 5,
            life: 300,
            repel: repel
        });
        return false; // Prevent default
    }
}

// Touch support
function touchStarted() {
    if (touches.length > 0) {
        let touch = touches[0];

        // Check if touching controls panel
        const controlsPanel = document.querySelector('.controls');
        const rect = controlsPanel.getBoundingClientRect();
        const touchedControls = touch.x >= rect.left && touch.x <= rect.right &&
                               touch.y >= rect.top && touch.y <= rect.bottom;

        if (!touchedControls) {
            interactionPoints.push({
                x: touch.x,
                y: touch.y,
                strength: 5,
                life: 300,
                repel: false
            });
        }
    }
    return false;
}

// Draw interaction point indicators
function drawInteractionPoints() {
    for (let point of interactionPoints) {
        let alpha = map(point.life, 0, 300, 0, 100);
        let size = map(point.strength, 0, 5, 10, 50);

        noFill();
        stroke(point.repel ? 0 : 200, 80, 100, alpha);
        strokeWeight(2);
        circle(point.x, point.y, size);

        strokeWeight(1);
        circle(point.x, point.y, size * 0.5);
    }
}

// ============================================
// UI CONTROLS & EVENTS
// ============================================
function setupUI() {
    // Mode buttons
    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            setMode(btn.dataset.mode);
        });
    });

    // Particle count slider
    const particleSlider = document.getElementById('particleSlider');
    const particleCount = document.getElementById('particleCount');
    particleSlider.addEventListener('input', (e) => {
        let newCount = parseInt(e.target.value);
        particleCount.textContent = newCount;

        // Add or remove particles
        if (newCount > particles.length) {
            for (let i = particles.length; i < newCount; i++) {
                particles.push(new Particle());
            }
        } else {
            particles.splice(newCount);
        }

        settings.particleCount = newCount;
    });

    // Speed slider
    const speedSlider = document.getElementById('speedSlider');
    const speedValue = document.getElementById('speedValue');
    speedSlider.addEventListener('input', (e) => {
        settings.speed = parseFloat(e.target.value);
        speedValue.textContent = settings.speed.toFixed(1);
    });

    // Trail slider
    const trailSlider = document.getElementById('trailSlider');
    const trailValue = document.getElementById('trailValue');
    trailSlider.addEventListener('input', (e) => {
        settings.trailLength = parseInt(e.target.value);
        trailValue.textContent = settings.trailLength;
    });

    // Color shift slider
    const colorSlider = document.getElementById('colorSlider');
    const colorValue = document.getElementById('colorValue');
    colorSlider.addEventListener('input', (e) => {
        settings.colorShiftSpeed = parseFloat(e.target.value);
        colorValue.textContent = settings.colorShiftSpeed.toFixed(1);
    });

    // Pause button
    document.getElementById('pauseBtn').addEventListener('click', () => {
        togglePause();
    });

    // Reset button
    document.getElementById('resetBtn').addEventListener('click', () => {
        resetSystem();
        showToast('System reset');
    });

    // Export button
    document.getElementById('exportBtn').addEventListener('click', () => {
        exportImage();
    });

    // FPS toggle button
    document.getElementById('fpsToggle').addEventListener('click', () => {
        toggleFPS();
    });

    // Fullscreen button
    document.getElementById('fullscreenBtn').addEventListener('click', () => {
        toggleFullscreen();
    });

    // Controls toggle (mobile)
    document.getElementById('controlsToggle').addEventListener('click', () => {
        document.querySelector('.controls').classList.toggle('hidden');
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', handleKeyPress);
}

// Handle keyboard shortcuts
function handleKeyPress(e) {
    // Don't trigger if user is typing in an input
    if (e.target.tagName === 'INPUT') return;

    switch(e.key.toLowerCase()) {
        case ' ':
            e.preventDefault();
            togglePause();
            break;
        case 'h':
            e.preventDefault();
            document.querySelector('.controls').classList.toggle('hidden');
            break;
        case 'f':
            e.preventDefault();
            toggleFullscreen();
            break;
        case 'r':
            e.preventDefault();
            resetSystem();
            showToast('System reset');
            break;
        case 'd':
            e.preventDefault();
            toggleFPS();
            break;
    }
}

// Set current mode and update UI
function setMode(mode) {
    // Don't restart transition if clicking same mode
    if (mode === currentMode && modeTransition === 1.0) return;

    // Start smooth transition from current to new mode
    if (mode !== currentMode) {
        previousMode = currentMode;
        currentMode = mode;
        modeTransition = 0.0; // Start transition
    }

    // Update button styles
    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.remove('active');
    });
    document.querySelector(`[data-mode="${mode}"]`).classList.add('active');

    // Flow field will update automatically during transition
}

// Reset the entire system
function resetSystem() {
    particles = [];
    interactionPoints = [];
    timeOffset = 0;
    colorOffset = 0;

    for (let i = 0; i < settings.particleCount; i++) {
        particles.push(new Particle());
    }

    background(20, 20, 30);
}

// Toggle pause state
function togglePause() {
    isPaused = !isPaused;
    const pauseBtn = document.getElementById('pauseBtn');
    pauseBtn.textContent = isPaused ? '▶ Resume' : '⏸ Pause';
    pauseBtn.classList.toggle('bg-green-600');
    pauseBtn.classList.toggle('bg-yellow-600');
    pauseBtn.classList.toggle('hover:bg-green-700');
    pauseBtn.classList.toggle('hover:bg-yellow-700');
    showToast(isPaused ? 'Paused' : 'Resumed');
}

// Toggle FPS counter
function toggleFPS() {
    showFPS = !showFPS;
    const fpsCounter = document.getElementById('fpsCounter');
    const fpsBtn = document.getElementById('fpsToggle');

    if (showFPS) {
        fpsCounter.classList.remove('hidden');
        fpsBtn.classList.add('bg-purple-600');
        fpsBtn.classList.remove('bg-gray-700');
    } else {
        fpsCounter.classList.add('hidden');
        fpsBtn.classList.remove('bg-purple-600');
        fpsBtn.classList.add('bg-gray-700');
    }
}

// Toggle fullscreen
function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
            showToast('Fullscreen not available');
        });
    } else {
        document.exitFullscreen();
    }
}

// Show toast notification
function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');

    setTimeout(() => {
        toast.classList.remove('show');
    }, 2000);
}

// Export current frame as high-res PNG
function exportImage() {
    // Create a high-res render
    let timestamp = new Date().toISOString().replace(/[:.]/g, '-').substring(0, 19);
    saveCanvas(`flow-field-${timestamp}`, 'png');
    showToast('Image exported!');
}

// Handle window resize
function windowResized() {
    resizeCanvas(windowWidth, windowHeight);
    flowField = new FlowField(20);

    // Reposition particles that are now out of bounds
    particles.forEach(p => {
        if (p.pos.x > width) p.pos.x = width;
        if (p.pos.y > height) p.pos.y = height;
    });
}

// Prevent right-click context menu on canvas only (for repeller mode)
window.addEventListener('load', () => {
    const canvas = document.querySelector('canvas');
    if (canvas) {
        canvas.addEventListener('contextmenu', event => event.preventDefault());
    }
});
</script>
